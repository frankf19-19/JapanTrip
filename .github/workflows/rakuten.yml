name: 更新楽天飯店庫 (rakuten_hotels.json)

on:
  workflow_dispatch: {}        # 可手動觸發(建議現在就跑第一次)
  schedule:
    - cron: "0 19 * * 5"       # 每週六凌晨 3 點(台灣時間)自動更新房價

permissions:
  contents: write

jobs:
  build-hotels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取楽天全區飯店
        run: python scripts/build_rakuten_hotels.py

      - name: Commit 變更
        run: |
          git config user.name "rakuten-bot"
          git config user.email "actions@github.com"
          git add data/rakuten_hotels.json
          git diff --cached --quiet || git commit -m "chore: 更新楽天飯店庫"
          git push
